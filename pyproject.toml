[project]
name = "ctis-cli"
version = "0.1.0"
description = "CLI tool to download CTIS trial documents."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "TestGPT"}]
dependencies = [
]

[project.scripts]
ctis-cli = "ctis_cli.cli:main"
ctis-gui = "ctis_cli.gui:main"

[project.optional-dependencies]
 dev = ["pytest>=7.4.0"]
 gui = ["pyinstaller>=6.0.0"]
 browser = ["playwright>=1.45.0"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
